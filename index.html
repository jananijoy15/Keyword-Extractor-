<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyword Extractor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Keyword Extractor</h1>
        <p class="subtitle">Find important keywords from your text</p>

        <textarea id="textInput"
            placeholder="Enter or paste your text here..."></textarea>

        <button onclick="extractKeywords()">Extract Keywords</button>

        <div class="stats">
            <div>
                <h3 id="wordCount">0</h3>
                <p>Total Words</p>
            </div>

            <div>
                <h3 id="keywordCount">0</h3>
                <p>Keywords</p>
            </div>
        </div>

        <div class="result">
            <h2>Important Keywords</h2>
            <div id="keywords">
                Keywords will appear here...
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
